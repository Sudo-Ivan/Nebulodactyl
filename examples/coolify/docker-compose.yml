# Nebulodactyl panel behind Coolify (or any reverse proxy).
#
# Coolify terminates TLS on its Traefik proxy and forwards plain HTTP to
# this container, so the panel must trust the proxy headers and know its
# public https URL.
#
# Required environment variables (set in Coolify or an .env next to this
# file):
#   APP_KEY        generate with: php artisan key:generate --show
#   HASHIDS_SALT   random string
#   DB_*           database settings, or DB_CONNECTION=sqlite
#   REDIS_*        redis settings if you use the redis service below

services:
  panel:
    image: ghcr.io/sudo-ivan/nebulodactyl:latest
    restart: unless-stopped
    volumes:
      - panel-var:/app/var
      - panel-logs:/app/storage/logs
      # Uncomment for sqlite deployments so the database survives rebuilds.
      # - panel-data:/app/database
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:-https://panel.example.com}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      # Trust the Coolify/Traefik proxy so the panel sees real client IPs
      # and knows requests arrived over https.
      TRUSTED_PROXIES: "*"
      SESSION_SECURE_COOKIE: "true"
      APP_KEY: ${APP_KEY}
      HASHIDS_SALT: ${HASHIDS_SALT}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-panel}
      DB_USERNAME: ${DB_USERNAME:-nebulodactyl}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    # No ports published: Coolify attaches its proxy to this service and
    # routes by domain. For a non-Coolify proxy, publish 80 and point it
    # at the container.

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-panel}
      MYSQL_USER: ${DB_USERNAME:-nebulodactyl}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  panel-var:
  panel-logs:
  # panel-data:
  mariadb-data:
  redis-data:
