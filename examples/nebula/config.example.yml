# Example Nebula host configuration for a Nebulodactyl panel or node.
#
# Nebula is a mutually authenticated, peer-to-peer overlay network. Every
# host needs a certificate signed by your CA (created with nebula-cert ca)
# that pins its name, overlay IP, and group membership.
#
# Docs: https://nebula.defined.net/docs/
#
# Example host cert creation:
#   nebula-cert ca -name "Nebulodactyl CA"
#   nebula-cert sign -name "panel" -ip "10.42.0.1/16" -groups "nebulodactyl,panel"
#   nebula-cert sign -name "node-1" -ip "10.42.0.11/16" -groups "nebulodactyl,nodes"

pki:
  ca: /etc/nebula/ca.crt
  cert: /etc/nebula/host.crt
  key: /etc/nebula/host.key

# Every lighthouse must be listed here since the discovery service itself
# cannot be discovered.
static_host_map:
  "10.42.0.250": ["lighthouse.example.com:4242"]

lighthouse:
  am_lighthouse: false
  interval: 60
  hosts:
    - "10.42.0.250"

listen:
  host: 0.0.0.0
  port: 4242

punchy:
  punch: true

tun:
  dev: nebula1
  mtu: 1300

# Default posture is deny-all; only allow what the panel needs.
firewall:
  outbound:
    - port: any
      proto: any
      host: any
  inbound:
    # Panel and nodes may reach the daemon API on this host.
    - port: "8080"
      proto: tcp
      groups: ["nebulodactyl"]
    # Allow ICMP for diagnostics between overlay hosts.
    - port: any
      proto: icmp
      group: nebulodactyl
