# Nebulodactyl panel stack: panel, MariaDB, Redis.
#
# Usage:
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env   (or let install.sh do all of this for you)
#   docker compose up -d
#
# Values like ${DB_PASSWORD} are read from the .env file in this directory.
# install.sh generates them for you. If you write .env by hand, set at least
# APP_URL, DB_PASSWORD, and DB_ROOT_PASSWORD.

x-common:
    database: &db-environment
        MYSQL_PASSWORD: &db-password ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    panel: &panel-environment
        APP_URL: ${APP_URL:-http://localhost}
        # A list of valid timezones can be found here: http://php.net/manual/en/timezones.php
        APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
        APP_SERVICE_AUTHOR: ${APP_SERVICE_AUTHOR:-noreply@localhost}
        DB_USERNAME: 'nebulodactyl'

        # Set this when the panel sits behind a reverse proxy (Coolify,
        # Traefik, nginx, Caddy, Cloudflare). Accepts IPs or CIDRs, comma
        # separated. Use * only if the panel port is unreachable except
        # through the proxy.
        TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
        SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}

        # Set to a real email to enable the built-in Let's Encrypt flow.
        # Leave empty when terminating TLS at your own proxy.
        LE_EMAIL: ${LE_EMAIL:-}

    mail: &mail-environment
        MAIL_MAILER: ${MAIL_MAILER:-smtp}
        MAIL_HOST: ${MAIL_HOST:-mail}
        MAIL_PORT: ${MAIL_PORT:-1025}
        MAIL_USERNAME: ${MAIL_USERNAME:-}
        MAIL_PASSWORD: ${MAIL_PASSWORD:-}
        MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
        MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@localhost}
        MAIL_FROM_NAME: 'Nebulodactyl Panel'

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make
# modifications below if you understand what you are doing.
#
services:
    database:
        image: mariadb:11.4
        restart: unless-stopped
        command: --default-authentication-plugin=mysql_native_password
        volumes:
          - './data/database:/var/lib/mysql'
        environment:
            <<: *db-environment
            MYSQL_DATABASE: 'panel'
            MYSQL_USER: 'nebulodactyl'
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 3s
            retries: 30

    cache:
        image: redis:7-alpine
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 30

    panel:
        # canary tracks master. Switch to :latest (or pin a version) once a
        # tagged release exists.
        image: ${PANEL_IMAGE:-ghcr.io/sudo-ivan/nebulodactyl:canary}
        restart: unless-stopped
        depends_on:
            database:
                condition: service_healthy
            cache:
                condition: service_healthy
        ports:
            # Behind a reverse proxy you can bind these to 127.0.0.1 instead:
            #   - '127.0.0.1:8080:80'
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
        volumes:
            - './data/var/:/app/var/'
            - './data/nginx/:/etc/nginx/http.d/'
            - './data/certs/:/etc/letsencrypt/'
            - './data/logs/:/app/storage/logs'
            - './data/storage/:/app/storage/app/public'
        environment:
            <<: [*panel-environment, *mail-environment]
            DB_PASSWORD: *db-password
            APP_ENV: 'production'
            APP_ENVIRONMENT_ONLY: 'false'
            CACHE_DRIVER: 'redis'
            SESSION_DRIVER: 'redis'
            QUEUE_CONNECTION: 'redis'
            REDIS_HOST: 'cache'
            DB_CONNECTION: 'mariadb'
            DB_HOST: 'database'
            DB_PORT: '3306'
            DB_DATABASE: 'panel'
            HASHIDS_LENGTH: 8
            # Nebula overlay networking is disabled by default. To route
            # panel-to-node traffic over Nebula, mount a host directory with
            # your CA material and set:
            #   NEBULA_ENABLED: 'true'
            #   NEBULA_CA_CERT: '/run/nebula/ca.crt'
            #   NEBULA_CA_KEY: '/run/nebula/ca.key'
            #   NEBULA_LIGHTHOUSES: '10.42.0.1'
            # See config/nebula.php for the full list.
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1/healthz']
            interval: 15s
            timeout: 5s
            retries: 12
            start_period: 60s

networks:
    default:
        ipam:
            config:
                - subnet: 172.20.0.0/16
