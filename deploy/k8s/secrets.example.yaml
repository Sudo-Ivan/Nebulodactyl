# Copy to secrets.yaml and fill in real values, or create the secret with
# kubectl create secret generic. Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: nebulodactyl
  namespace: nebulodactyl
type: Opaque
stringData:
  APP_KEY: "base64:generate-with-php-artisan-key:generate---show"
  DB_PASSWORD: "change-me"
  DB_ROOT_PASSWORD: "change-me"
  REDIS_PASSWORD: "change-me"
  APP_SERVICE_AUTHORIZATION: "generate-a-64-char-hex-string"
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb
  namespace: nebulodactyl
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: "change-me"
  MARIADB_PASSWORD: "change-me"
