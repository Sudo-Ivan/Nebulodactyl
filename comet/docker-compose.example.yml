# Comet node daemon. Works with docker compose, podman-compose, or
# docker CLI pointed at a Podman socket.
#
# Enroll the node first using the command generated by the panel
# (Admin > Nodes > Configuration > Generate Token), which looks like:
#   comet enroll --panel-url https://panel.example.com --token <token> --node <id>
#
# Podman notes:
#   - Point the daemon at the Podman socket in /etc/comet/config.yml:
#       docker:
#         host: unix:///run/podman/podman.sock
#     or set DOCKER_HOST before starting comet.
#   - Rootless Podman: enable the user socket with
#       systemctl --user enable --now podman.socket
#     and use unix://$XDG_RUNTIME_DIR/podman/podman.sock instead.
#   - Mount whichever socket you picked in place of docker.sock below.

name: comet

services:
  comet:
    image: ghcr.io/sudo-ivan/nebulodactyl-comet:canary
    restart: always
    networks:
      - comet0
    ports:
      - "8080:8080"
      - "2022:2022"
    tty: true
    environment:
      TZ: "UTC"
      COMET_UID: 988
      COMET_GID: 988
      COMET_USERNAME: comet
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      # For podman use the podman socket instead:
      # - "/run/podman/podman.sock:/var/run/docker.sock"
      - "/etc/comet/:/etc/comet/"
      - "/var/lib/comet/:/var/lib/comet/"
      - "/var/log/comet/:/var/log/comet/"
      - "/tmp/comet/:/tmp/comet/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
      - "/run/comet:/run/comet"
      # Required for ssl if you use let's encrypt. uncomment to use.
      #- "/etc/letsencrypt/:/etc/letsencrypt/"

networks:
  comet0:
    name: comet0
    driver: bridge
    ipam:
      config:
        - subnet: "172.21.0.0/16"
    driver_opts:
      com.docker.network.bridge.name: comet0
